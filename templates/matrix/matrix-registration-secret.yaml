{{- $name := "matrix-synapse-registration-secret" -}}
{{- $secret := .Values.global.secrets.matrixRegistrationSharedSecret -}}
{{- if ne (trim $secret) $secret -}}
{{- fail "global.secrets.matrixRegistrationSharedSecret must not start or end with whitespace" -}}
{{- end -}}
{{- if eq (dig "existingSecret" "name" "" (.Values.matrixrtcAuth | default dict)) $name -}}
{{- fail "matrixrtcAuth.existingSecret.name must not use matrix-synapse-registration-secret" -}}
{{- end -}}
{{- if eq (dig "existingConfigSecret" "name" "" (.Values.livekit | default dict)) $name -}}
{{- fail "livekit.existingConfigSecret.name must not use matrix-synapse-registration-secret" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  registration-shared-secret: {{ $secret | b64enc | quote }}
